<g class='n1'><text class='h' x='49' y='160' font-size='88' fill='#6A0DAD' textLength='590' lengthAdjust='spacing'>JONATHAN</text><text class='h' x='44' y='155' font-size='88' fill='#1a1423' textLength='590' lengthAdjust='spacing'>JONATHAN</text></g>
<rect class='mk' x='34' y='182' width='492' height='84' fill='#ffd23f' transform='rotate(-1.2 34 224)'/>
<g class='n2'><text class='h' x='44' y='255' font-size='88' fill='#1a1423' textLength='470' lengthAdjust='spacing'>LECLERC</text></g>
<rect class='bl' x='540' y='190' width='26' height='72' fill='#6A0DAD'/>

<g class='fi'><text class='m' x='48' y='312' font-size='24' fill='#1a1423' fill-opacity='.75' textLength='62' lengthAdjust='spacing'>alias</text><text class='m' x='122' y='312' font-size='38' font-weight='700' fill='#6A0DAD' textLength='104' lengthAdjust='spacing'>Nailt</text></g>
<path class='dr' pathLength='1' d='M124,322 q9,-8 18,0 t18,0 t18,0 t18,0 t18,0 t18,0' fill='none' stroke='#6A0DAD' stroke-width='3' stroke-linecap='round'/>

<g class='wig'><text class='m' x='652' y='80' font-size='30' font-weight='700' fill='#6A0DAD' textLength='96' lengthAdjust='spacing'>hello !</text></g>
