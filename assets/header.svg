<path class='dr' style='animation-delay:2.7s' pathLength='1' d='M649,116 L641,126 L654,133' fill='none' stroke='#6A0DAD' stroke-width='3' stroke-linecap='round' stroke-linejoin='round'/>

<g class='pop'>
