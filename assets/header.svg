<svg xmlns='http://www.w3.org/2000/svg' width='1000' height='366' viewBox='0 0 1000 366' role='img' aria-label='Jonathan LECLERC, alias Nailt'>
<defs>
<pattern id='dots' width='24' height='24' patternUnits='userSpaceOnUse'><circle cx='3' cy='3' r='1.3' fill='#1a1423' fill-opacity='.2'/></pattern>
<clipPath id='in'><rect x='5' y='5' width='973' height='331'/></clipPath>
<path id='ring' d='M738,208 a82,82 0 1,1 164,0 a82,82 0 1,1 -164,0'/>
</defs>
<style>
.h{font-family:'Arial Black','Helvetica Neue',Helvetica,Arial,sans-serif;font-weight:900}
.m{font-family:'Segoe Print','Bradley Hand','Marker Felt','Chalkboard SE','Comic Sans MS',cursive}
.s{font-family:'Arial Black','Helvetica Neue',Helvetica,Arial,sans-serif;font-weight:900}
@keyframes mq{to{transform:translateX(-922.2px)}}
.mq{animation:mq 26s linear infinite}
@keyframes inl{from{transform:translateX(-70px);opacity:0}to{transform:translateX(0);opacity:1}}
.n1{animation:inl .7s cubic-bezier(.2,.9,.3,1) .1s both}
.n2{animation:inl .7s cubic-bezier(.2,.9,.3,1) .3s both}
@keyframes mk{from{transform:scaleX(0)}to{transform:scaleX(1)}}
.mk{transform-box:fill-box;transform-origin:left center;animation:mk .6s cubic-bezier(.6,0,.2,1) .9s both}
@keyframes dr{from{stroke-dashoffset:1}to{stroke-dashoffset:0}}
.dr{stroke-dasharray:1;stroke-dashoffset:1;animation:dr .8s ease-out 1.7s both}
@keyframes fi{from{opacity:0;transform:translateY(10px)}to{opacity:1;transform:translateY(0)}}
.fi{animation:fi .6s ease-out 1.4s both}
@keyframes bl{0%,49%{opacity:1}50%,100%{opacity:0}}
.bl{animation:bl 1.1s step-end infinite}
@keyframes spin{to{transform:rotate(360deg)}}
.spin{transform-origin:820px 208px;animation:spin 28s linear infinite}
@keyframes wig{0%,100%{transform:rotate(-7deg)}50%{transform:rotate(-1deg)}}
.wig{transform-origin:690px 80px;animation:wig 3.4s ease-in-out infinite}
@keyframes pop{from{transform:scale(0) rotate(-40deg)}to{transform:scale(1) rotate(0)}}
.pop{transform-origin:820px 208px;animation:pop .6s cubic-bezier(.3,1.6,.5,1) 1.1s both}
</style>
