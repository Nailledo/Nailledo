<svg xmlns='http://www.w3.org/2000/svg' width='1000' height='100' viewBox='0 0 1000 100' role='img' aria-label='Ma stack'>
<style>
@keyframes pop{0%{transform:scale(0) rotate(-30deg)}70%{transform:scale(1.15)}100%{transform:scale(1) rotate(0)}}
.pop{transform-box:fill-box;transform-origin:center;animation:pop .55s cubic-bezier(.3,1.4,.5,1) .1s both}
@keyframes bob{0%,100%{transform:rotate(-8deg) translateY(0)}50%{transform:rotate(4deg) translateY(-4px)}}
.bob{transform-box:fill-box;transform-origin:center;animation:bob 4s ease-in-out infinite}
@keyframes sl{from{transform:translateX(-24px);opacity:0}to{transform:translateX(0);opacity:1}}
.sl{animation:sl .5s ease-out .25s both}
@keyframes dr{from{stroke-dashoffset:1}to{stroke-dashoffset:0}}
.dr{stroke-dasharray:1;stroke-dashoffset:1;animation:dr .8s ease-out .6s both}
.dr2{stroke-dasharray:1;stroke-dashoffset:1;animation:dr 1.2s ease-out .9s both}
</style>
